# BLX - Auto-generate blog posts, static index, and GitHub activity data
# Triggers on push to main when content changes, and on a schedule for GitHub data refresh
name: Generate Blog Posts

on:
  push:
    branches:
      - main
    paths:
      - 'books/**'
      - 'blog-posts/**'
      - 'scripts/**'
      - '.github/workflows/generate-blog.yml'
  schedule:
    # BLX - Run every 6 hours to refresh GitHub activity data
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog posts from books/
        run: python3 scripts/generate-blog-from-books.py

      - name: Scan blog-posts/ and rebuild index
        run: python3 scripts/scan-blog-posts.py

      - name: Generate GitHub activity data
        run: python3 scripts/generate-github-data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          git add -f js/blog-data.js
          git add -f js/github-data.js
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-generated blog posts and GitHub activity data [skip ci]"
          git push
