<!DOCTYPE html>
<html>
<head>
    <title>Blenux - GitHub</title>
    <script src="js/theme-toggle.js"></script>
</head>

<body>
    <header>GitHub</header>

    <nav>
        <a href="index.html">Home</a>
        <a href="blogs.html">Blogs</a>
        <a href="github.html">GitHub</a>
        <a href="https://blenux.github.io/blender-extensions/">Extensions</a>
        <a href="about.html">About</a>
        <select id="theme-select" aria-label="Choose theme"></select>
    </nav>

    <main>
        <div id="github-profile" class="github-profile">
            <p>Loading profile...</p>
        </div>

        <div class="github-grid">
            <section class="github-section">
                <h2>My Repositories</h2>
                <div id="github-repos">
                    <p>Loading repositories...</p>
                </div>
            </section>

            <section class="github-section">
                <h2>Recent Commits</h2>
                <div id="github-activity">
                    <p>Loading activity...</p>
                </div>
            </section>
        </div>

        <div class="github-grid github-contributions">
            <section class="github-section">
                <h2>Contributions</h2>
                <div id="github-contrib-repos">
                    <p>Loading contributions...</p>
                </div>
            </section>

            <section class="github-section">
                <h2>Contribution Commits</h2>
                <div id="github-contrib-activity">
                    <p>Loading contribution commits...</p>
                </div>
            </section>
        </div>
    </main>

    <footer>
        &copy; 2026, All Rights Reserved
    </footer>

    <script src="js/github-data.js"></script>
    <script src="js/github-activity.js"></script>
</body>
</html>
